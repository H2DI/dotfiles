set -g mode-keys vi
set -g mouse on
# set -g default-terminal "screen-256color"
set -g focus-events on


set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"


# Inactive pane: muted Flexoki background
set -g window-style 'fg=default,bg=#282726'
# Active pane: normal Flexoki dark background
set -g window-active-style 'fg=default,bg=#100f0f'


bind-key -n C-j select-pane -t :.-
bind-key -n C-k select-pane -t :.+

# Clipboard: forward copies to the local (iTerm2) clipboard over OSC52, so a
# drag/`y` in a remote tmux lands in the Mac clipboard for ⌘V.
# (iTerm2: enable "Applications in terminal may access clipboard".)
set -g set-clipboard on
# screen-256color lacks the Ms (OSC52) capability, so tmux would swallow yanks
# instead of forwarding them. Declare it for every outer terminal.
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Mouse drag-release and `y` copy the selection to the clipboard and leave copy-mode.
bind -T copy-mode-vi y             send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
