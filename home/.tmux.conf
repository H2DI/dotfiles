set -g mode-keys vi
set -g mouse on
set -g default-terminal "screen-256color"
set -g focus-events on

# Highlight the active pane's border (survives fully-painted TUIs)
set -g pane-border-style        fg=colour240
set -g pane-active-border-style fg=colour45

# Dim inactive panes with a darker background. Note: has no effect inside
# fully-painted TUIs (vim, htop, pagers) that draw their own background — the
# active-border rule above is the reliable indicator; this is complementary.
set -g window-style        'fg=default,bg=colour236'
set -g window-active-style 'fg=default,bg=colour233'


bind-key -n C-j select-pane -t :.-
bind-key -n C-k select-pane -t :.+

# Clipboard: forward copies to the local (iTerm2) clipboard over OSC52, so a
# drag/`y` in a remote tmux lands in the Mac clipboard for ⌘V.
# (iTerm2: enable "Applications in terminal may access clipboard".)
set -g set-clipboard on
# screen-256color lacks the Ms (OSC52) capability, so tmux would swallow yanks
# instead of forwarding them. Declare it for every outer terminal.
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Mouse drag-release and `y` copy the selection to the clipboard and leave copy-mode.
bind -T copy-mode-vi y             send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Escape hatch for a plain native iTerm2 selection: hold ⌥ Option while dragging,
# then ⌘C — bypasses tmux mouse capture entirely (spans panes).
